# ============================================================
# WARNING: DEVELOPMENT ONLY
# DO NOT use this file in production environments.
# For production: docker compose -f docker-compose.prod.yml up
# ============================================================
# This file uses bind mounts for live-reload during development.
# Database port is exposed for local tools (pgAdmin, DBeaver).
# Credentials come from .env (see .env.example).
# ============================================================

services:

  # ──────────────────────────────────────────────
  # PHP + Apache
  # ──────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: remtys_app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: remtys2_db
      DB_USER: postgres
      DB_PASS: ${DB_PASS:?Define DB_PASS en .env (ver .env.example)}
      APP_URL: http://localhost:8080/remtysapp/public
      APP_ENV: docker
      APP_DEBUG: "true"
      APP_TIMEZONE: America/Mexico_City
      APP_MUNICIPIO: ${APP_MUNICIPIO:-Municipio Demo}
      SESSION_COOKIE_SECURE: "false"
      SESSION_COOKIE_SAMESITE: Lax
      MAIL_TRANSPORT: smtp
      MAIL_SMTP_HOST: mailpit
      MAIL_SMTP_PORT: 1025
      MAIL_SMTP_ENCRYPTION: "none"
      MAIL_SMTP_USERNAME: ""
      MAIL_SMTP_PASSWORD: ""
      MAIL_FROM_ADDRESS: no-reply@ejemplo.com
      MAIL_FROM_NAME: REMTYS Notificaciones
    volumes:
      - .:/var/www/html/remtysapp
      - remtys_storage:/var/www/html/remtysapp/storage
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/remtysapp/public/ -o /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "512M"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - remtys_net

  # ──────────────────────────────────────────────
  # PostgreSQL 17
  # ──────────────────────────────────────────────
  db:
    image: postgres:17
    container_name: remtys_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: remtys2_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASS:?Define DB_PASS en .env (ver .env.example)}
      # Contraseña de los usuarios demo creados por seeds.sql (ver README)
      PGOPTIONS: "-c remtys.demo_password=${DEMO_PASSWORD:-}"
      TZ: America/Mexico_City
      PGTZ: America/Mexico_City
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seeds.sql:/docker-entrypoint-initdb.d/02-seeds.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d remtys2_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "1G"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - remtys_net

  # ──────────────────────────────────────────────
  # Mailpit — SMTP de desarrollo
  # UI: http://localhost:8025  SMTP: puerto 1025
  # ──────────────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: remtys_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8025/api/v1/info"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "128M"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - remtys_net

volumes:
  postgres_data:
  remtys_storage:

networks:
  remtys_net:
    driver: bridge
