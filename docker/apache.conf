# ============================================================
# REMTYS APP — Apache VirtualHost (Production-Hardened)
# ============================================================

# Ocultar version de Apache en respuestas HTTP
ServerTokens Prod
ServerSignature Off

# Limites de tiempo y tamano de request (22 MB para uploads)
Timeout 60
LimitRequestBody 22020096

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    # -----------------------------------------------------------
    # Configuracion global: sin directory listing
    # -----------------------------------------------------------
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all denied
    </Directory>

    # -----------------------------------------------------------
    # UNICA ruta publica: el front controller
    # -----------------------------------------------------------
    <Directory /var/www/html/remtysapp/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # -----------------------------------------------------------
    # DENEGAR ACCESO a directorios sensibles (defensa en profundidad)
    # Aunque .htaccess tambien los protege, Apache los bloquea
    # a nivel de VirtualHost para no depender de AllowOverride
    # -----------------------------------------------------------
    <Directory /var/www/html/remtysapp/config>
        Require all denied
    </Directory>

    <Directory /var/www/html/remtysapp/database>
        Require all denied
    </Directory>

    <Directory /var/www/html/remtysapp/storage>
        Require all denied
    </Directory>

    <Directory /var/www/html/remtysapp/app>
        Require all denied
    </Directory>

    <Directory /var/www/html/remtysapp/backups>
        Require all denied
    </Directory>

    <Directory /var/www/html/remtysapp/scripts>
        Require all denied
    </Directory>

    <Directory /var/www/html/remtysapp/.git>
        Require all denied
    </Directory>

    <Directory /var/www/html/remtysapp/.claude>
        Require all denied
    </Directory>

    <Directory /var/www/html/remtysapp/docker>
        Require all denied
    </Directory>

    # -----------------------------------------------------------
    # Bloquear archivos sensibles por extension/nombre
    # -----------------------------------------------------------
    <FilesMatch "\.(env|git|htaccess|sql|md|log)$">
        Require all denied
    </FilesMatch>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # -----------------------------------------------------------
    # Security headers (defensa en profundidad)
    # -----------------------------------------------------------
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-XSS-Protection "1; mode=block"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always unset X-Powered-By
        Header unset Server
    </IfModule>

    # -----------------------------------------------------------
    # Logs
    # -----------------------------------------------------------
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
